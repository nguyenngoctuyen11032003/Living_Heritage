# Runs on every Pull Request and is called by deploy.yml before any deploy.
# No secrets needed: web uses public vars, database runs Supabase locally in Docker.
name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
      VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || format('/{0}/', github.event.repository.name) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Chặn secret lọt vào biến VITE_*
        run: node scripts/check-public-env.mjs
      - name: Migration đã deploy không bị sửa, tên file hợp lệ
        run: node scripts/check-migrations-immutable.mjs
      - name: Test các script trong scripts/
        run: node --test scripts/*.test.mjs
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Bundle không chứa secret hay source map
        run: node scripts/check-bundle-secrets.mjs

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz (from the release's gitleaks_8.30.1_checksums.txt).
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned version + checksum)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      # .gitleaks.toml: default rules, only .env templates allowlisted. .gitleaksignore (optional): reviewed fake fixtures.
      - name: Scan every commit
        run: |
          ignore=()
          if [ -f .gitleaksignore ]; then ignore=(--gitleaks-ignore-path .gitleaksignore); fi
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml "${ignore[@]}" \
            --redact --no-banner --exit-code 1 .

  functions:
    name: Edge Functions (Deno check, lint, test)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.6
      - run: deno check ai-process/index.ts
      - run: deno lint
      - name: deno test
        # `deno test` fails with "No test modules found" when there are no tests yet.
        run: |
          shopt -s globstar nullglob
          tests=(**/*_test.ts **/*.test.ts)
          if [ ${#tests[@]} -eq 0 ]; then
            echo "No Deno tests yet."
            exit 0
          fi
          deno test --allow-env

  database:
    name: Database migrations + RLS tests (local Supabase)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Same version as the "supabase" devDependency in the root package.json.
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.120.0
      # Must be `supabase start` (not `db start`) so Auth/REST/Storage come up too (RLS tests use auth + storage).
      - name: Apply all migrations + seed on a fresh local stack
        run: supabase start -x studio,imgproxy,vector,logflare,edge-runtime,realtime,mailpit,postgres-meta
      - name: Lint database schema
        run: supabase db lint --fail-on error
      - name: RLS + RPC tests (pgTAP)
        run: supabase test db
      - name: Stop local stack
        if: always()
        run: supabase stop --no-backup
