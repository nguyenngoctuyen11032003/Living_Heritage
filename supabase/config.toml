# Local stack only (hosted auth settings live in the Supabase Dashboard). Ports 544xx avoid clashing with Linguo (553xx).
project_id = "living-heritage"

[api]
enabled = true
port = 54421
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54422
shadow_port = 54420
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54423

[inbucket]
enabled = true
port = 54424

[storage]
enabled = true
file_size_limit = "25MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/**", "http://localhost:4173/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true
enable_anonymous_sign_ins = true
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = false

[edge_runtime]
enabled = true
deno_version = 2

[functions.ai-process]
verify_jwt = true

[functions.public-audio-sync]
verify_jwt = true

# Public "ask the knowledge hub" endpoint: callable without sign-in (publishable key), rate limited inside the function.
[functions.knowledge-ask]
verify_jwt = false

[functions.question-tts]
verify_jwt = true
